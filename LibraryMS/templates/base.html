<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quán Cà phê Sông Hương - Không gian thư giãn tại Huế">
    <title>{% block title %}{% endblock %} - Sông Hương</title>

    <!-- Thêm Google Fonts (Be Vietnam Pro) để chữ hiển thị đẹp và hiện đại hơn -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        /* Ghi đè font chữ mặc định của Bootstrap */
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #f8f9fa; /* Màu nền sáng, dịu mắt */
        }
        
        /* Hiệu ứng cuộn trang mượt mà */
        html {
            scroll-behavior: smooth;
        }

        /* Thêm hiệu ứng nổi nhẹ cho các thẻ card (nếu sử dụng trong các trang con) */
        .card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important;
        }
    </style>

    {% block styles %}{% endblock %}
</head>
<!-- Thêm d-flex, flex-column và min-vh-100 để đảm bảo Footer luôn nằm ở đáy màn hình -->
<body class="d-flex flex-column min-vh-100">

    <!-- Bọc Navbar trong thẻ header, thêm hiệu ứng bóng đổ và ghim trên cùng -->
    <header class="sticky-top shadow-sm">
        {% include "_navbar.html" %}
    </header>

    <!-- Thêm flex-grow-1 để phần nội dung chiếm toàn bộ không gian trống ở giữa -->
    <main class="container flex-grow-1 py-5">
        {% block content %}
        {% endblock %}
    </main>

    <!-- mt-auto đẩy Footer xuống sát đáy trang khi nội dung bên trên quá ngắn -->
    <footer class="mt-auto bg-dark text-white">
        {% include "_footer.html" %}
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Block để chèn thêm Javascript riêng cho từng trang con (nếu cần) -->
    {% block scripts %}{% endblock %}
</body>
</html>
