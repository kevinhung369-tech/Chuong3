<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>LibraryMS</title>
    <!-- Nhúng thư viện Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Thanh điều hướng Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">📚 LibraryMS</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index') }}">Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('list_books') }}">Danh sách sách</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Khung chứa nội dung chính -->
    <div class="container bg-white p-4 rounded shadow-sm">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
